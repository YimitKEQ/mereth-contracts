/* The register of sworn work.
   Renders in Chromium over live gameplay, so the ground is dark enough to read against any
   scene and the contracts themselves are the only pale things on screen. */


:root{
  --void:#000;
  --iron:#0B0908;
  --iron-2:#141110;
  --iron-3:#1C1815;

  --vellum:#E6DEC9;
  --vellum-2:#DCD2B8;
  --vellum-ink:#231C12;
  --vellum-ink-2:#5B4F3C;
  --vellum-ink-3:#8A7C63;

  --brass:#C89635;
  --brass-lit:#F0C95C;
  --brass-dim:#8A6A26;

  --wax-open:#B8912F;
  --wax-held:#3F7D52;
  --wax-broken:#9E3B33;
  --wax-closed:#5A5148;

  --ash:#9A9084;
  --ash-2:#6E6559;

  --rule:rgba(200,150,53,.22);
  --rule-soft:rgba(200,150,53,.12);
  --carve:rgba(255,240,210,.05);

  --display:"Yimmy",ui-sans-serif,system-ui,sans-serif;
  --sans:"Yimmy",ui-sans-serif,system-ui,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;

  --chamfer:12px;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans);
  color:var(--vellum);
  background:transparent;               /* the game shows through around the panel */
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
  user-select:none;
}

#scrim{
  position:fixed;inset:0;
  background:
    radial-gradient(130% 100% at 50% 0%, rgba(0,0,0,.62), rgba(0,0,0,.86) 55%, rgba(0,0,0,.94));
  display:flex;align-items:center;justify-content:center;
  padding:clamp(8px,2vh,26px);
  opacity:0;animation:fade .28s ease forwards;
}
@keyframes fade{to{opacity:1}}

#panel{
  width:min(1120px,97vw);height:min(780px,95vh);
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,var(--iron-2),var(--iron));
  border:1px solid var(--rule);
  box-shadow:rgba(0,0,0,.8) 0 34px 90px -24px, inset 0 1px 0 var(--carve);
  clip-path:polygon(var(--chamfer) 0,100% 0,100% calc(100% - var(--chamfer)),calc(100% - var(--chamfer)) 100%,0 100%,0 var(--chamfer));
  transform:translateY(9px);animation:rise .34s cubic-bezier(.2,.7,.3,1) .04s forwards;
}
@keyframes rise{to{transform:none}}

/* ---------------- header ---------------- */
header{
  flex:none;display:flex;align-items:center;gap:18px;
  padding:16px 22px 14px;border-bottom:1px solid var(--rule);
  background:linear-gradient(180deg,rgba(200,150,53,.07),transparent);
}
.sigil{width:26px;height:26px;flex:none;opacity:.9}
.mark{line-height:1.1}
.mark .t{
  font-family:var(--display);font-size:17px;
  letter-spacing:.13em;text-transform:uppercase;color:var(--brass-lit);
}
.mark .s{
  font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--ash-2);margin-top:3px;
}
.who{margin-left:auto;text-align:right;line-height:1.3}
.who .n{
  font-family:var(--display);font-size:13.5px;
  letter-spacing:.07em;color:var(--vellum);
}
.who .p{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ash-2);margin-top:3px}
.purse{
  text-align:right;padding-left:20px;margin-left:20px;border-left:1px solid var(--rule-soft);
}
.purse .v{
  font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-size:20px;color:var(--brass-lit);line-height:1;
}
.purse .l{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--ash-2);margin-top:6px}
.hint{
  font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--ash-2);
  border:1px solid var(--rule-soft);padding:6px 9px;margin-left:18px;white-space:nowrap;
}

/* ---------------- tabs ---------------- */
nav{flex:none;display:flex;padding:0 22px;border-bottom:1px solid var(--rule-soft);background:var(--iron)}
.tab{
  appearance:none;background:none;border:0;cursor:pointer;color:var(--ash-2);
  font-family:var(--display);font-size:11px;
  letter-spacing:.12em;text-transform:uppercase;
  padding:14px 17px;border-bottom:2px solid transparent;
  transition:color .13s ease,border-color .13s ease;
}
.tab:hover{color:var(--vellum)}
.tab[aria-selected="true"]{color:var(--brass-lit);border-bottom-color:var(--brass)}
.tab .c{
  font-family:var(--mono);font-size:10px;margin-left:7px;
  font-variant-numeric:tabular-nums;color:var(--ash-2);
}
.tab[aria-selected="true"] .c{color:var(--brass)}

/* ---------------- body ---------------- */
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:20px 22px 26px}
main::-webkit-scrollbar{width:9px}
main::-webkit-scrollbar-thumb{background:var(--rule)}
main::-webkit-scrollbar-track{background:rgba(0,0,0,.3)}

.empty{padding:70px 20px;text-align:center;max-width:52ch;margin:0 auto}
.empty b{
  display:block;font-family:var(--display);font-size:14px;
  letter-spacing:.15em;text-transform:uppercase;color:var(--ash);margin-bottom:12px;
}
.empty span{color:var(--ash-2);font-size:13.5px;line-height:1.6}

/* ---------------- the leaf ---------------- */
.leaf{
  position:relative;
  background:
    /* faint rules, so a short entry leaves ruled paper rather than a blank patch */
    repeating-linear-gradient(180deg, transparent 0 25px, rgba(60,45,20,.055) 25px 26px),
    /* the tooth of the paper, generated rather than an image */
    repeating-linear-gradient(94deg, rgba(90,70,40,.03) 0 2px, transparent 2px 5px),
    linear-gradient(176deg,var(--vellum) 0%,var(--vellum-2) 100%);
  background-position:0 12px, 0 0, 0 0;
  color:var(--vellum-ink);
  padding:15px 18px 14px;margin-bottom:12px;
  box-shadow:rgba(0,0,0,.5) 0 10px 26px -12px;
  /* torn along the foot, straight along the head: a leaf cut from a longer register */
  clip-path:polygon(0 0,100% 0,100% calc(100% - 7px),96% 100%,88% calc(100% - 5px),
    74% 100%,61% calc(100% - 6px),47% 100%,33% calc(100% - 5px),19% 100%,8% calc(100% - 6px),0 100%);
  opacity:0;transform:translateY(7px);
  animation:leaf .3s cubic-bezier(.2,.7,.3,1) forwards;
}
@keyframes leaf{to{opacity:1;transform:none}}
.leaf:nth-child(1){animation-delay:.02s}
.leaf:nth-child(2){animation-delay:.06s}
.leaf:nth-child(3){animation-delay:.1s}
.leaf:nth-child(4){animation-delay:.14s}
.leaf:nth-child(n+5){animation-delay:.17s}

.leaf-body{display:grid;grid-template-columns:1fr 196px;column-gap:22px;align-items:start}
.leaf-main{min-width:0}
/* The margin column, ruled like a ledger: seal, fee, the funding flag, then what you may do. */
.leaf-side{
  display:flex;flex-direction:column;align-items:flex-end;gap:11px;
  border-left:1px solid rgba(35,28,18,.16);padding-left:18px;
}
.side-head{display:flex;align-items:center;justify-content:flex-end;gap:13px;width:100%}
@media (max-width:820px){
  .leaf-body{grid-template-columns:1fr}
  .leaf-side{border-left:0;padding-left:0;align-items:flex-start;
    border-top:1px solid rgba(35,28,18,.14);padding-top:12px;margin-top:12px}
}
.leaf h3{
  font-family:var(--display);font-size:15px;line-height:1.3;letter-spacing:-.005em;
  color:#170F07;letter-spacing:.01em;
}
.by{
  margin-top:7px;font-size:11.5px;color:var(--vellum-ink-2);
  display:flex;flex-wrap:wrap;gap:4px 13px;align-items:baseline;
}
.by b{color:var(--vellum-ink)}
.terms{
  margin-top:9px;padding-top:9px;border-top:1px solid rgba(35,28,18,.14);
  font-size:12.6px;line-height:1.62;color:#3D3323;white-space:pre-wrap;max-width:70ch;
}

/* the fee, set as a figure in a ledger */
.fee{text-align:right}
.fee .v{
  font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-size:22px;line-height:1;color:#241A0B;
}
.fee .l{
  display:block;font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--vellum-ink-3);margin-top:6px;
}

/* the funding flag: the loudest thing on the leaf, because it is the whole idea */
.flag{
  display:inline-flex;align-items:center;gap:7px;
  font-family:var(--display);font-size:9.5px;
  letter-spacing:.1em;text-transform:uppercase;text-align:right;
  padding:6px 9px;border:1px solid currentColor;line-height:1.25;
}
.flag.held{color:#2C6340}
.flag.word{color:#8A5A14}
.flag .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}

.chip{
  font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  padding:5px 9px;border:1px solid rgba(35,28,18,.24);color:var(--vellum-ink-2);
  white-space:nowrap;
}

/* wax seal: state as an object, not just a colour */
.seal{
  width:44px;height:44px;border-radius:50%;flex:none;
  display:grid;place-items:center;text-align:center;
  font-family:var(--display);font-size:7.5px;
  letter-spacing:.09em;text-transform:uppercase;color:rgba(255,255,255,.9);
  box-shadow:inset 0 -2px 5px rgba(0,0,0,.35),inset 0 2px 4px rgba(255,255,255,.22),
    rgba(0,0,0,.34) 0 3px 7px -1px;
  background:radial-gradient(circle at 36% 30%, rgba(255,255,255,.3), transparent 58%), var(--wax-closed);
  line-height:1.1;padding:0 4px;
}
.seal.open{background:radial-gradient(circle at 36% 30%,rgba(255,255,255,.32),transparent 58%),var(--wax-open)}
.seal.held{background:radial-gradient(circle at 36% 30%,rgba(255,255,255,.3),transparent 58%),var(--wax-held)}
.seal.broken{
  background:radial-gradient(circle at 36% 30%,rgba(255,255,255,.26),transparent 58%),var(--wax-broken);
  /* a seal that has been broken across the middle */
  clip-path:polygon(0 0,100% 0,100% 42%,52% 48%,100% 56%,100% 100%,0 100%,0 57%,46% 50%,0 43%);
}

/* actions sit on the dark, below the leaf, so the paper stays a document */
.acts{display:flex;flex-direction:column;gap:7px;width:100%}
button.act{
  appearance:none;cursor:pointer;width:100%;
  font-family:var(--display);font-size:10.5px;
  letter-spacing:.14em;text-transform:uppercase;padding:9px 16px;
  background:#231C12;color:var(--vellum);border:1px solid #231C12;
  transition:background .13s ease,color .13s ease;
}
button.act:hover{background:#3A2E1D}
button.act.ghost{background:transparent;color:var(--vellum-ink-2);border-color:rgba(35,28,18,.3)}
button.act.ghost:hover{background:rgba(35,28,18,.09);color:var(--vellum-ink)}
button.act.warn{background:transparent;color:#8E3129;border-color:rgba(142,49,41,.42)}
button.act.warn:hover{background:rgba(142,49,41,.1)}
button:focus-visible,.tab:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{
  outline:2px solid var(--brass);outline-offset:2px;
}

/* ---------------- debts ---------------- */
.note{
  display:flex;align-items:center;gap:16px;padding:15px 18px;margin-bottom:11px;
  background:linear-gradient(176deg,#241713,#1B1210);
  border:1px solid rgba(158,59,51,.3);
}
.note .txt{font-size:13.5px;color:var(--vellum-2);line-height:1.5}
.note .txt b{color:var(--vellum)}
.note .amt{
  margin-left:auto;font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-size:19px;color:#D4645F;white-space:nowrap;
}
.note .amt small{display:block;font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ash-2);margin-top:5px;font-family:var(--sans)}

/* ---------------- the draft ---------------- */
form{max-width:720px}
.field{margin-bottom:17px}
label.lbl{
  display:block;font-family:var(--display);font-size:10px;
  letter-spacing:.2em;text-transform:uppercase;color:var(--ash);margin-bottom:8px;
}
input[type=text],input[type=number],textarea,select{
  width:100%;font-family:var(--sans);font-size:13.5px;color:var(--vellum);
  background:var(--void);border:1px solid var(--rule-soft);padding:10px 12px;outline:none;
}
input:focus,textarea:focus,select:focus{border-color:var(--brass)}
textarea{resize:vertical;min-height:92px;line-height:1.55}
.row{display:flex;gap:15px;flex-wrap:wrap}
.row .field{flex:1;min-width:150px}
.seg{display:flex;border:1px solid var(--rule-soft);width:fit-content}
.seg button{
  appearance:none;background:transparent;border:0;cursor:pointer;color:var(--ash-2);
  font-family:var(--display);font-size:10.5px;
  letter-spacing:.14em;text-transform:uppercase;padding:10px 18px;
}
.seg button[aria-pressed="true"]{background:rgba(200,150,53,.13);color:var(--brass-lit)}
.note-txt{font-size:12px;color:var(--ash-2);line-height:1.55;margin-top:9px;max-width:60ch}
button.seal-it{
  appearance:none;cursor:pointer;margin-top:6px;
  font-family:var(--display);font-size:11px;
  letter-spacing:.12em;text-transform:uppercase;padding:13px 26px;
  background:rgba(200,150,53,.14);color:var(--brass-lit);border:1px solid var(--rule);
  transition:background .13s ease,color .13s ease;
}
button.seal-it:hover{background:rgba(200,150,53,.24);color:#fff}

/* ---------------- the clerk's line ---------------- */
#notice{
  flex:none;padding:0 22px;max-height:0;overflow:hidden;
  border-top:1px solid transparent;font-size:12.5px;
  transition:max-height .22s ease,padding .22s ease;
  display:flex;align-items:center;gap:11px;
}
#notice.show{max-height:56px;padding:13px 22px;border-top-color:var(--rule-soft)}
#notice .stamp{
  font-family:var(--display);font-size:9px;letter-spacing:.18em;
  text-transform:uppercase;padding:4px 9px;flex:none;
}
#notice.ok{background:rgba(63,125,82,.1);color:#7FC494}
#notice.ok .stamp{background:rgba(63,125,82,.22);color:#9BD6AC}
#notice.bad{background:rgba(158,59,51,.11);color:#D98B85}
#notice.bad .stamp{background:rgba(158,59,51,.25);color:#EBA9A3}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>
<div id="scrim">
  <div id="panel">
    <header>
      <svg class="sigil" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 1.6 3 5.4v6.9c0 5 3.8 9 9 10.1 5.2-1.1 9-5.1 9-10.1V5.4z"
              stroke="#C89635" stroke-width="1.1" fill="rgba(200,150,53,.09)"/>
        <path d="M8 9.4h8M8 12.4h8M8 15.4h5" stroke="#C89635" stroke-width="1.1" stroke-linecap="round"/>
      </svg>
      <div class="mark">
        <div class="t">Contracts</div>
        <div class="s">Register of sworn work</div>
      </div>
      <div class="who">
        <div class="n" id="who">Waiting</div>
        <div class="p" id="whoSub">Not signed</div>
      </div>
      <div class="purse">
        <div class="v" id="coin">0</div>
        <div class="l">Septims</div>
      </div>
      <div class="hint">F3 closes</div>
    </header>

    <nav id="tabs" role="tablist"></nav>
    <main id="view"></main>
    <div id="notice"></div>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ---- transport ---------------------------------------------------------
  // Argument 0 is the channel name because Skyrim Platform delivers the argument array and
  // discards the function name. The server's event source listens on exactly this.
  function send(payload) {
    try {
      if (window.skyrimPlatform && window.skyrimPlatform.sendMessage) {
        window.skyrimPlatform.sendMessage("mereth:contract", payload);
        return true;
      }
    } catch (e) {}
    return false;
  }

  function ui(message) {
    try {
      if (window.skyrimPlatform && window.skyrimPlatform.sendMessage) {
        window.skyrimPlatform.sendMessage("mereth:ui", message);
      }
    } catch (e) {}
  }

  // ---- state -------------------------------------------------------------
  // Everything here came from the server. Nothing is decided in this file.
  var view = {
    rev: 0,
    self: { formId: 0, profileId: null, name: "Waiting", coin: 0 },
    board: [], mine: [], debts: [], notice: null
  };
  var tab = "board";
  var draft = { kind: "service", funding: "funded" };
  var shownNoticeAt = 0;

  var TABS = [
    { id: "board", label: "The Board", n: function () { return view.board.length } },
    { id: "mine",  label: "In My Name", n: function () { return view.mine.length } },
    { id: "debts", label: "Debts",      n: function () { return view.debts.length } },
    { id: "post",  label: "Draft One",  n: function () { return null } }
  ];

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function plural(n, one, many) { return n === 1 ? one : many }

  function remaining(deadline) {
    var ms = deadline - Date.now();
    if (ms <= 0) return "lapsed";
    var m = Math.floor(ms / 60000);
    if (m < 60) return m + " " + plural(m, "minute", "minutes") + " left";
    var h = Math.floor(m / 60);
    if (h < 48) return h + " " + plural(h, "hour", "hours") + " left";
    var d = Math.floor(h / 24);
    return d + " " + plural(d, "day", "days") + " left";
  }

  // ---- the seal ----------------------------------------------------------
  // State encoded as an object rather than only a colour: an untouched seal, a pressed one,
  // and one broken across the middle.
  var SEALS = {
    open:      { cls: "open",   text: "Open" },
    accepted:  { cls: "open",   text: "Taken" },
    delivered: { cls: "open",   text: "Done" },
    settled:   { cls: "held",   text: "Paid" },
    defaulted: { cls: "broken", text: "Unpaid" },
    rejected:  { cls: "broken", text: "Refused" },
    expired:   { cls: "",       text: "Lapsed" },
    withdrawn: { cls: "",       text: "Pulled" }
  };

  function sealFor(c) {
    var s = SEALS[c.state] || { cls: "", text: c.state };
    return '<div class="seal ' + s.cls + '" title="' + esc(c.state) + '">' + esc(s.text) + "</div>";
  }

  function flagFor(c) {
    return c.funding === "funded"
      ? '<span class="flag held"><span class="dot"></span>Coin held in escrow</span>'
      : '<span class="flag word"><span class="dot"></span>On his word alone</span>';
  }

  function actionsFor(c) {
    var me = view.self.formId;
    var isClient = c.clientId === me;
    var isWorker = c.workerId === me;
    var out = [];
    if (c.state === "open" && !isClient) out.push(["accept", "Take this work", ""]);
    if (c.state === "open" && isClient) out.push(["withdraw", "Withdraw it", "ghost"]);
    if (c.state === "accepted" && isWorker) out.push(["deliver", "Report it done", ""]);
    if (c.state === "delivered" && isClient) {
      out.push(["settle", "Accept and pay", ""]);
      out.push(["reject", "Refuse the work", "warn"]);
    }
    if (!out.length) return "";
    return '<div class="acts">' + out.map(function (a) {
      return '<button class="act ' + a[2] + '" data-do="' + a[0] + '" data-id="' + esc(c.id) + '">' + esc(a[1]) + "</button>";
    }).join("") + "</div>";
  }

  function leaf(c) {
    var goods = c.kind === "goods" && c.deliverable
      ? '<span class="chip">' + esc(c.deliverable.count) + " " + esc(c.deliverable.label) + "</span>" : "";
    return '' +
      '<article class="leaf">' +
        '<div class="leaf-body">' +
          '<div class="leaf-main">' +
            "<h3>" + esc(c.title) + "</h3>" +
            '<div class="by">' +
              "<span>Set down by <b>" + esc(c.clientName) + "</b></span>" +
              (c.workerName ? "<span>Taken by <b>" + esc(c.workerName) + "</b></span>" : "") +
              "<span>" + esc(remaining(c.deadline)) + "</span>" + goods +
            "</div>" +
            '<div class="terms">' + esc(c.body) + "</div>" +
          "</div>" +
          '<div class="leaf-side">' +
            '<div class="side-head">' + sealFor(c) +
              '<div class="fee"><div class="v">' + esc(c.reward) + '</div><span class="l">Septims</span></div>' +
            "</div>" +
            flagFor(c) +
            actionsFor(c) +
          "</div>" +
        "</div>" +
      "</article>";
  }

  function empty(title, line) {
    return '<div class="empty"><b>' + esc(title) + "</b><span>" + esc(line) + "</span></div>";
  }

  function renderBoard() {
    if (!view.board.length) {
      return empty("Nothing is posted", "No one is hiring. Draft a contract and it will hang here for every soul in Skyrim to read.");
    }
    return view.board.map(leaf).join("");
  }

  function renderMine() {
    if (!view.mine.length) {
      return empty("Your name is on nothing", "Work you set down, and work you have taken on, are both kept here.");
    }
    return view.mine.map(leaf).join("");
  }

  function renderDebts() {
    if (!view.debts.length) {
      return empty("No debts stand against anyone", "When a promise cannot be paid, a note is written here naming both parties. It does not go away.");
    }
    return view.debts.map(function (d) {
      return '<div class="note"><div class="txt"><b>' + esc(d.debtorName) + "</b> owes <b>" +
        esc(d.creditorName) + "</b><br><span style=\"color:var(--ash-2);font-size:11.5px\">against " +
        esc(d.contractId) + '</span></div><div class="amt">' + esc(d.amount) + "<small>Septims</small></div></div>";
    }).join("");
  }

  function renderDraft() {
    var goods = draft.kind === "goods";
    var funded = draft.funding === "funded";
    return '' +
      '<form id="postForm">' +
        '<div class="field">' +
          '<label class="lbl">What is asked</label>' +
          '<div class="seg" id="kindSeg">' +
            '<button type="button" data-kind="service" aria-pressed="' + (!goods) + '">A service</button>' +
            '<button type="button" data-kind="goods" aria-pressed="' + goods + '">Goods handed over</button>' +
          "</div>" +
          '<div class="note-txt">Goods are settled by the server counting them into your hands. A service is settled on the worker’s word, which is the point: it is a promise others can watch you keep.</div>' +
        "</div>" +
        '<div class="field"><label class="lbl">Title</label>' +
          '<input type="text" id="title" maxlength="100" placeholder="Escort a salt wagon to Whiterun" autocomplete="off" /></div>' +
        '<div class="field"><label class="lbl">The terms</label>' +
          '<textarea id="body" maxlength="1500" placeholder="Say plainly what you want done, and what counts as done."></textarea></div>' +
        '<div class="row">' +
          '<div class="field"><label class="lbl">Fee in septims</label>' +
            '<input type="number" id="reward" min="0" max="1000000" value="250" /></div>' +
          '<div class="field"><label class="lbl">Stands for</label>' +
            '<select id="duration">' +
              '<option value="3600000">One hour</option>' +
              '<option value="21600000">Six hours</option>' +
              '<option value="86400000" selected>A day</option>' +
              '<option value="259200000">Three days</option>' +
              '<option value="604800000">Seven days</option>' +
            "</select></div>" +
        "</div>" +
        (goods ? '<div class="row">' +
          '<div class="field"><label class="lbl">Item form id</label><input type="text" id="dFormId" placeholder="0x0005ACE4" autocomplete="off" /></div>' +
          '<div class="field"><label class="lbl">How many</label><input type="number" id="dCount" min="1" max="10000" value="10" /></div>' +
          '<div class="field"><label class="lbl">Called</label><input type="text" id="dLabel" maxlength="80" placeholder="iron ingots" autocomplete="off" /></div>' +
        "</div>" : "") +
        '<div class="field">' +
          '<label class="lbl">How it is paid</label>' +
          '<div class="seg" id="fundSeg">' +
            '<button type="button" data-fund="funded" aria-pressed="' + funded + '">Bind the coin now</button>' +
            '<button type="button" data-fund="unfunded" aria-pressed="' + (!funded) + '">On my word</button>' +
          "</div>" +
          '<div class="note-txt">' + (funded
            ? "The fee leaves your purse the moment you set this down and is held. When the work is reported done you have two days to accept it or refuse it. Say nothing and it pays out on its own, so nobody can be left waiting on you."
            : "Nothing leaves your purse now. When the work is done you settle it yourself, and if you cannot pay, a debt note is written in your name for anyone to read.") +
          "</div>" +
        "</div>" +
        '<button class="seal-it" type="submit">Set it down</button>' +
      "</form>";
  }

  function renderTabs() {
    document.getElementById("tabs").innerHTML = TABS.map(function (t) {
      var n = t.n();
      return '<button class="tab" role="tab" data-tab="' + t.id + '" aria-selected="' + (tab === t.id) + '">' +
        esc(t.label) + (n === null ? "" : '<span class="c">' + n + "</span>") + "</button>";
    }).join("");
  }

  function render() {
    var self = view.self || {};
    document.getElementById("who").textContent = self.name || "Waiting";
    document.getElementById("whoSub").textContent =
      self.profileId === null || self.profileId === undefined ? "No account bound" : "Account " + self.profileId;
    document.getElementById("coin").textContent = self.coin || 0;

    renderTabs();
    document.getElementById("view").innerHTML =
      tab === "board" ? renderBoard() :
      tab === "mine"  ? renderMine()  :
      tab === "debts" ? renderDebts() : renderDraft();

    var n = document.getElementById("notice");
    if (view.notice && view.notice.at !== shownNoticeAt) {
      shownNoticeAt = view.notice.at;
      n.innerHTML = '<span class="stamp">' + (view.notice.ok ? "Entered" : "Refused") + "</span>" + esc(view.notice.text);
      n.className = "show " + (view.notice.ok ? "ok" : "bad");
    }
  }

  // ---- input -------------------------------------------------------------
  document.addEventListener("click", function (e) {
    var t = e.target;
    if (!t || t.nodeType !== 1) return;

    var tabBtn = t.closest("[data-tab]");
    if (tabBtn) { tab = tabBtn.getAttribute("data-tab"); render(); return; }

    var act = t.closest("[data-do]");
    if (act) { send({ action: act.getAttribute("data-do"), id: act.getAttribute("data-id") }); return; }

    var kind = t.closest("[data-kind]");
    if (kind) { draft.kind = kind.getAttribute("data-kind"); render(); return; }

    var fund = t.closest("[data-fund]");
    if (fund) { draft.funding = fund.getAttribute("data-fund"); render(); return; }
  });

  document.addEventListener("submit", function (e) {
    if (!e.target || e.target.id !== "postForm") return;
    e.preventDefault();
    function val(id) { var el = document.getElementById(id); return el ? el.value : "" }

    var payload = {
      action: "post",
      draft: {
        kind: draft.kind,
        funding: draft.funding,
        title: val("title"),
        body: val("body"),
        reward: parseInt(val("reward"), 10) || 0,
        durationMs: parseInt(val("duration"), 10) || 86400000
      }
    };
    if (draft.kind === "goods") {
      // Form ids are read and written in hex everywhere else in Skyrim, so accept hex here
      // and convert rather than making the player do it.
      var raw = String(val("dFormId")).trim();
      payload.draft.deliverable = {
        formId: /^0x/i.test(raw) ? parseInt(raw, 16) : (parseInt(raw, 10) || 0),
        count: parseInt(val("dCount"), 10) || 1,
        label: val("dLabel")
      };
    }
    send(payload);
    tab = "mine";
    render();
  });

  document.addEventListener("keydown", function (e) { if (e.key === "Escape") ui("close") });

  // ---- the only entry point ----------------------------------------------
  window.mereth = {
    onView: function (next) {
      if (!next || typeof next !== "object") return;
      view = next;
      if (!Array.isArray(view.board)) view.board = [];
      if (!Array.isArray(view.mine)) view.mine = [];
      if (!Array.isArray(view.debts)) view.debts = [];
      if (!view.self) view.self = { formId: 0, profileId: null, name: "Waiting", coin: 0 };
      render();
    }
  };

  render();
}());
</script>
</body>
</html>
